<!-- Shared static <head> boilerplate reference. Actual <head> is assembled by build/build.js
     (which injects per-page title/description/canonical around this shared boilerplate),
     kept here as the single source of truth for the static parts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/img/icon.png" />
<meta name="theme-color" content="#E94C2A" />
<meta name="robots" content="index, follow" />
<meta name="author" content="Markt Technologies" />
<meta property="og:site_name" content="Markt" />
<meta property="og:type" content="website" />
<meta property="og:image" content="/assets/img/icon.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@marktcommerce" />
