<script>
  (function () {
    var path = window.location.pathname.replace(/\/?$/, '/');
    document.querySelectorAll('[data-business-nav]').forEach(function (link) {

        link.setAttribute('aria-current', 'page');
        link.classList.remove('text-tertiary', 'dark:text-zinc-400');
        link.classList.add('text-secondary', 'dark:text-zinc-50', 'bg-neutral', 'dark:bg-zinc-900');
        // On phones the row scrolls sideways; bring the current page into view.
        var scroller = link.closest('[data-business-nav-scroller]');
        if (scroller) scroller.scrollLeft = link.offsetLeft - scroller.offsetLeft - 16;
      }
    });
  })();
</script>
