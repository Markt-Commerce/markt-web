<header class="header-animate fixed top-3 sm:top-6 left-0 right-0 z-50 flex justify-center px-3 sm:px-4">
  <div class="bg-white/80 dark:bg-secondary/80 backdrop-blur-xl border border-outline dark:border-zinc-800 shadow-kinetic flex items-center justify-between px-4 sm:px-6 py-3 sm:py-4 rounded-lg w-full max-w-7xl ring-1 ring-black/5 dark:ring-white/10 transition-all">
    <a href="/" class="flex items-center gap-2 sm:gap-3 pl-1 sm:pl-2 cursor-pointer group">
      <div class="w-10 h-10 rounded-DEFAULT bg-white dark:bg-secondary flex items-center justify-center shadow-sm overflow-hidden border border-outline dark:border-zinc-700 group-hover:scale-105 transition-transform">
        <div class="w-full h-full overflow-hidden">
          <img src="/assets/img/icon.png" alt="Markt" class="w-full h-full object-cover object-center scale-150" />
        </div>
      </div>
      <span class="font-bold text-2xl tracking-tighter hidden sm:block font-display">Markt</span>
    </a>

    <div class="flex items-center gap-2 sm:gap-4">
      <button type="button" data-dark-toggle aria-label="Toggle Dark Mode" class="w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center rounded-full hover:bg-neutral dark:bg-transparent dark:hover:bg-zinc-800 transition-colors text-tertiary dark:text-zinc-400">
        <svg data-icon-sun class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg data-icon-moon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
      </button>
      <button type="button" data-menu-open aria-label="Toggle Menu" class="w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-900 dark:text-white hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">
        <svg data-icon-menu width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <svg data-icon-close class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>
</header>
